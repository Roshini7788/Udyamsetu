name: scheme_matching_app
description: "YojanaSetu - AI-Driven Scheme Matching for Marginalized Entrepreneurs (SIH26092)"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # State management
  provider: ^6.1.2

  # Networking (used from Phase 3 onward)
  http: ^1.2.1

  # Local persistence (auth token, saved schemes, cached profile)
  shared_preferences: ^2.2.3

  # Speech-to-text / Text-to-speech (added when Phase 6 voice work starts)
  speech_to_text: ^7.0.0
  flutter_tts: ^4.0.2

  # Maps (added for Phase 8 - Channel Partners)
  google_maps_flutter: ^2.6.1
  geolocator: ^12.0.0

  # Charts for EMI breakdown (Phase 7)
  fl_chart: ^0.68.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
